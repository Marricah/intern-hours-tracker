<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends of the Digital Library - Intern Hours Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        .progress-bar { transition: width 0.5s ease-in-out; }
        .modal-overlay { transition: opacity 0.2s ease-in-out; }
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex justify-between items-center flex-wrap gap-4">
            <h1 class="text-2xl font-bold text-slate-900 flex items-center">
                <i class="fa-solid fa-book-open text-indigo-600 mr-3"></i>
                Friends of the Digital Library 
                <span class="text-slate-400 font-normal text-xl mx-2">|</span> 
                <span class="text-indigo-600">Intern Hours Tracker</span>
            </h1>
            <div class="flex gap-3">
                <button onclick="resetData()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition">
                    <i class="fa-solid fa-rotate-left mr-2"></i>Reset Data
                </button>
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition">
                    <i class="fa-solid fa-download mr-2"></i>Export CSV
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8" id="stats-grid">
            <!-- Stats will be injected here -->
        </div>

        <!-- Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="relative w-full sm:w-96">
                <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Search by intern name..." 
                    class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
            <div class="text-sm text-slate-500">
                Showing <span id="resultCount" class="font-bold text-slate-800">0</span> interns
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Intern Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Required</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider w-64">Progress</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Total</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Remaining</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-slate-200">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- View Modal (Weekly Breakdown) -->
    <div id="viewModal" class="modal-overlay fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
            <button onclick="closeViewModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 id="viewModalTitle" class="text-xl font-bold text-slate-900 mb-4"></h3>
            <div id="viewModalContent" class="space-y-4"></div>
        </div>
    </div>

    <!-- Edit Modal (Add/Update Hours) -->
    <div id="editModal" class="modal-overlay fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-slate-900 mb-2">Edit Hours</h3>
            <p id="editModalName" class="text-sm text-slate-500 mb-4 font-medium"></p>
            
            <div id="editModalInputs" class="space-y-3 max-h-80 overflow-y-auto pr-2 mb-4">
                <!-- Inputs injected here -->
            </div>

            <div class="flex gap-3 pt-4 border-t border-slate-200">
                <button onclick="addNewWeek()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-plus mr-1"></i> Add Week
                </button>
                <button onclick="saveEditedHours()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-save mr-1"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <script>
        // Default Data
        const defaultInterns = [
            { name: "Angalbeth Haea", required: 120, weeks: [6, 10.5, 17.5, 2.5] },
            { name: "Brian Kumi", required: 120, weeks: [7, 7, 4.5, 10.5] },
            { name: "Daniella Busem", required: 150, weeks: [11, 28, 19.5, 15] },
            { name: "Desmond Pilimbo", required: 120, weeks: [7, 0, 1.5, 3] },
            { name: "Elemi Peter", required: 150, weeks: [24, 24.5, 18, 9.5] },
            { name: "Ezekiel Awili", required: 120, weeks: [11, 9, 0, 6] },
            { name: "Genesis Yasa", required: 20, weeks: [1, 1, 1, 2] }, 
            { name: "Gibson Dickson", required: 120, weeks: [2, 5, 5.5, 0] },
            { name: "Gregory Mundrau", required: 120, weeks: [9, 8.5, 10.5, 10] },
            { name: "Jasmine Aris", required: 150, weeks: [9, 7, 16.5, 9] },
            { name: "Jennifer Raka", required: 150, weeks: [19, 14, 11.5, 3.5] },
            { name: "Jerry John", required: 150, weeks: [6, 2, 3, 0] },
            { name: "Judith Wana", required: 120, weeks: [11, 2, 10, 13] },
            { name: "Michaellyne Garalom", required: 30, weeks: [7, 13.5, 12, 3.5] },
            { name: "Patricia Aworeba", required: 120, weeks: [9, 6, 6, 0] },
            { name: "Toka-Aldu Tangoi", required: 120, weeks: [6.5, 2, 6.5, 0] },
            { name: "Velroy Yaki", required: 120, weeks: [12.5, 2.5, 14, 19.5] },
            { name: "Nasinom Timothy", required: 80, weeks: [0, 8.5, 5.5, 4.5] },
            { name: "Gayleen Posikei", required: 150, weeks: [0, 0, 9, 0] }
        ];

        // Load from LocalStorage or use default
        let interns = JSON.parse(localStorage.getItem('internHoursData')) || JSON.parse(JSON.stringify(defaultInterns));
        let currentEditIndex = -1;

        // Save to LocalStorage
        function saveData() {
            localStorage.setItem('internHoursData', JSON.stringify(interns));
            renderStats();
            renderTable();
        }

        // Reset to default
        function resetData() {
            if(confirm("Are you sure you want to reset all data to the original defaults? This cannot be undone.")) {
                interns = JSON.parse(JSON.stringify(defaultInterns));
                saveData();
            }
        }

        // Helper to format hours
        function formatHours(h) {
            if (h === 0) return "0 hrs";
            const hrs = Math.floor(h);
            const mins = Math.round((h - hrs) * 60);
            if (mins === 0) return `${hrs} hrs`;
            return `${hrs} hrs ${mins} mins`;
        }

        // Render Dashboard Stats
        function renderStats() {
            const totalInterns = interns.length;
            const totalHoursLogged = interns.reduce((sum, i) => sum + i.weeks.reduce((a, b) => a + b, 0), 0);
            const completedInterns = interns.filter(i => i.weeks.reduce((a, b) => a + b, 0) >= i.required).length;
            const avgProgress = totalInterns > 0 ? (interns.reduce((sum, i) => {
                const total = i.weeks.reduce((a, b) => a + b, 0);
                return sum + Math.min(100, (total / i.required) * 100);
            }, 0) / totalInterns).toFixed(1) : 0;

            const stats = [
                { label: "Total Interns", value: totalInterns, icon: "fa-users", color: "text-blue-600", bg: "bg-blue-50" },
                { label: "Total Hours Logged", value: formatHours(totalHoursLogged), icon: "fa-clock", color: "text-indigo-600", bg: "bg-indigo-50" },
                { label: "Completed", value: `${completedInterns} / ${totalInterns}`, icon: "fa-check-circle", color: "text-emerald-600", bg: "bg-emerald-50" },
                { label: "Average Progress", value: `${avgProgress}%`, icon: "fa-chart-line", color: "text-amber-600", bg: "bg-amber-50" }
            ];

            document.getElementById('stats-grid').innerHTML = stats.map(s => `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                    <div class="${s.bg} ${s.color} p-3 rounded-lg text-xl"><i class="fa-solid ${s.icon}"></i></div>
                    <div>
                        <p class="text-sm text-slate-500 font-medium">${s.label}</p>
                        <p class="text-xl font-bold text-slate-900">${s.value}</p>
                    </div>
                </div>
            `).join('');
        }

        // Render Table
        function renderTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = interns.filter(i => i.name.toLowerCase().includes(query));
            document.getElementById('resultCount').innerText = filtered.length;

            document.getElementById('tableBody').innerHTML = filtered.map((intern, idx) => {
                const originalIndex = interns.indexOf(intern);
                const total = intern.weeks.reduce((a, b) => a + b, 0);
                const remaining = Math.max(0, intern.required - total);
                const progress = Math.min(100, (total / intern.required) * 100);
                
                let statusBadge = '';
                let barColor = 'bg-blue-500';
                if (total >= intern.required) {
                    statusBadge = `<span class="px-2 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">Completed</span>`;
                    barColor = 'bg-emerald-500';
                } else if (total === 0) {
                    statusBadge = `<span class="px-2 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-600">Not Started</span>`;
                    barColor = 'bg-slate-300';
                } else {
                    statusBadge = `<span class="px-2 py-1 text-xs font-semibold rounded-full bg-amber-100 text-amber-800">In Progress</span>`;
                    barColor = 'bg-indigo-500';
                }

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">${intern.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${intern.required} hrs</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center gap-2">
                                <div class="w-full bg-slate-200 rounded-full h-2.5">
                                    <div class="${barColor} h-2.5 rounded-full progress-bar" style="width: ${progress}%"></div>
                                </div>
                                <span class="text-xs font-medium text-slate-500 w-10 text-right">${progress.toFixed(0)}%</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 text-right font-semibold">${formatHours(total)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600 text-right">${formatHours(remaining)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">${statusBadge}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">
                            <div class="flex justify-center gap-3">
                                <button onclick='openViewModal(${originalIndex})' class="text-slate-500 hover:text-indigo-600 text-sm font-medium" title="View Details">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                                <button onclick='openEditModal(${originalIndex})' class="text-indigo-600 hover:text-indigo-800 text-sm font-medium" title="Edit Hours">
                                    <i class="fa-solid fa-pen-to-square"></i> Edit
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- VIEW MODAL LOGIC ---
        function openViewModal(index) {
            const intern = interns[index];
            const total = intern.weeks.reduce((a, b) => a + b, 0);
            document.getElementById('viewModalTitle').innerText = intern.name;
            
            const maxWeek = Math.max(...intern.weeks, 1); 
            
            document.getElementById('viewModalContent').innerHTML = `
                <div class="mb-4 p-3 bg-slate-50 rounded-lg flex justify-between text-sm border border-slate-200">
                    <span class="text-slate-600">Target: <strong>${intern.required} hrs</strong></span>
                    <span class="text-slate-900 font-bold">Total: ${formatHours(total)}</span>
                </div>
                ${intern.weeks.map((w, i) => `
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-medium text-slate-600 w-16">Week ${i + 1}</span>
                        <div class="flex-1 bg-slate-100 rounded-full h-4 relative overflow-hidden">
                            <div class="bg-indigo-500 h-4 rounded-full" style="width: ${(w / maxWeek) * 100}%"></div>
                        </div>
                        <span class="text-sm font-semibold text-slate-800 w-24 text-right">${formatHours(w)}</span>
                    </div>
                `).join('')}
            `;
            
            const modal = document.getElementById('viewModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.add('hidden');
            document.getElementById('viewModal').classList.remove('flex');
        }

        // --- EDIT MODAL LOGIC ---
        function openEditModal(index) {
            currentEditIndex = index;
            const intern = interns[index];
            document.getElementById('editModalName').innerText = `Updating hours for: ${intern.name}`;
            
            renderEditInputs(intern.weeks);
            
            const modal = document.getElementById('editModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function renderEditInputs(weeksArray) {
            const container = document.getElementById('editModalInputs');
            container.innerHTML = weeksArray.map((w, i) => `
                <div class="flex items-center gap-3">
                    <label class="text-sm font-medium text-slate-700 w-16">Week ${i + 1}</label>
                    <input type="number" step="0.5" min="0" value="${w}" 
                        class="week-input flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" 
                        data-index="${i}" placeholder="0">
                    <span class="text-xs text-slate-500 w-12">hours</span>
                </div>
            `).join('');
        }

        function addNewWeek() {
            const inputs = document.querySelectorAll('.week-input');
            const currentWeeks = Array.from(inputs).map(input => parseFloat(input.value) || 0);
            currentWeeks.push(0);
            renderEditInputs(currentWeeks);
        }

        function saveEditedHours() {
            const inputs = document.querySelectorAll('.week-input');
            const newWeeks = Array.from(inputs).map(input => parseFloat(input.value) || 0);
            interns[currentEditIndex].weeks = newWeeks;
            saveData();
            closeEditModal();
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('flex');
            currentEditIndex = -1;
        }

        // Export CSV
        function exportCSV() {
            const maxWeeks = Math.max(...interns.map(i => i.weeks.length));
            let header = "Name,Required Hours";
            for(let i = 1; i <= maxWeeks; i++) {
                header += `,Week ${i}`;
            }
            header += ",Total Hours,Remaining Hours\n";
            
            let csv = header;
            interns.forEach(i => {
                const total = i.weeks.reduce((a, b) => a + b, 0);
                const rem = Math.max(0, i.required - total);
                let row = `"${i.name}",${i.required}`;
                for(let j = 0; j < maxWeeks; j++) {
                    row += `,${i.weeks[j] !== undefined ? i.weeks[j] : 0}`;
                }
                row += `,${total},${rem}\n`;
                csv += row;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Friends_of_the_Digital_Library_Intern_Hours.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Close modals on outside click
        document.getElementById('viewModal').addEventListener('click', (e) => {
            if (e.target.id === 'viewModal') closeViewModal();
        });
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeEditModal();
        });

        // Initialize
        renderStats();
        renderTable();
    </script>
</body>
</html>
